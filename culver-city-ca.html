    <style>        :root {

        .why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:24px}
        .why-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:24px 20px;transition:var(--transition);box-shadow:var(--shadow-soft)}
        .why-card:hover{border-color:var(--accent-gold-border);transform:translateY(-4px);box-shadow:var(--shadow-medium)}
        .why-card i{font-size:1.2rem;color:var(--accent-gold);margin-bottom:12px;display:block} .why-card h4{font-size:.92rem;font-weight:700;color:var(--text-dark);margin-bottom:8px} .why-card p{font-size:.84rem;color:var(--text-body)}

        .permit-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
        .permit-can{background:var(--accent-green-soft);border:1px solid rgba(63,166,106,.2);border-radius:var(--radius-sm);padding:24px 28px}
        .permit-can h4{color:var(--accent-green);font-size:.95rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .permit-can ul{list-style:none;padding:0} .permit-can ul li{padding:5px 0 5px 22px;position:relative;font-size:.86rem;color:var(--text-body)}
        .permit-can ul li::before{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:0;color:var(--accent-green);font-size:.7rem;top:8px}
        .permit-cannot{background:var(--accent-red-soft);border:1px solid rgba(192,86,79,.15);border-radius:var(--radius-sm);padding:24px 28px}
        .permit-cannot h4{color:var(--accent-red);font-size:.95rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .permit-cannot ul{list-style:none;padding:0} .permit-cannot ul li{padding:5px 0 5px 22px;position:relative;font-size:.86rem;color:var(--text-body)}
        .permit-cannot ul li::before{content:'\f00d';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;left:0;color:var(--accent-red);font-size:.7rem;top:8px}

        .faq-item{background:var(--bg-card);border:1px solid var(--border-light);border-radius:14px;margin-bottom:14px;overflow:hidden;transition:var(--transition);box-shadow:var(--shadow-soft)}
        .faq-item:hover{border-color:var(--accent-gold-border);box-shadow:var(--shadow-medium)}
        .faq-item summary{padding:22px 28px;font-weight:600;font-size:1rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--text-dark);transition:var(--transition)}
        .faq-item summary::-webkit-details-marker{display:none}
        .faq-item summary::after{content:'\f067';font-family:'Font Awesome 6 Free';font-weight:900;color:var(--accent-gold);transition:transform .3s ease;font-size:.85rem}
        .faq-item[open] summary::after{transform:rotate(45deg)} .faq-item[open]{border-color:var(--accent-gold-border);box-shadow:var(--shadow-medium)} .faq-item[open] summary{color:var(--accent-gold);background:var(--accent-gold-soft)}
        .faq-item p{padding:0 28px 22px;color:var(--text-body);font-size:.93rem;line-height:1.7;animation:fadeIn .3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

        .cta-box{background:linear-gradient(135deg,#ede8f8,#ede8f8,#e8e0f5);border:1px solid var(--accent-gold-border);border-radius:24px;padding:60px 40px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-medium)}
        .cta-box::before{content:'';position:absolute;top:-50%;right:-30%;width:400px;height:400px;background:radial-gradient(circle,rgba(128,99,199,.08) 0%,transparent 70%);border-radius:50%}
        .cta-box::after{content:'';position:absolute;bottom:-40%;left:-20%;width:300px;height:300px;background:radial-gradient(circle,rgba(217,111,159,.05) 0%,transparent 70%);border-radius:50%}
        .cta-box h2,.cta-box p,.cta-box a,.cta-box div{position:relative;z-index:1}
        .cta-box .btn-header{background:var(--text-dark);color:#fff;box-shadow:0 4px 20px rgba(45,42,38,.2)} .cta-box .btn-header:hover{background:var(--accent-gold);box-shadow:0 8px 30px rgba(128,99,199,.3)}
        .cta-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:32px}

        .form-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px;text-align:left}
        .form-field{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg-white);border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:.85rem;color:var(--text-light)} .form-field i{color:var(--accent-gold);font-size:.8rem}

        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start} .two-col-wide{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:start}

        .scroll-reveal{opacity:0;transform:translateY(30px);transition:all .7s cubic-bezier(.25,.46,.45,.94)} .scroll-reveal.visible{opacity:1;transform:translateY(0)}
/* Footer */
        footer {
            background: var(--text-dark);
            color: rgba(255, 255, 255, 0.7);
            padding: 70px 0 30px 0;
        }

        .f-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr;
            gap: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .f-col h4 { color: white; margin-bottom: 20px; font-size: 1rem; }
        .f-col ul { list-style: none; }
        .f-col li { margin-bottom: 12px; }
        .f-col a { color: rgba(255, 255, 255, 0.55); text-decoration: none; font-size: 0.9rem; transition: var(--transition); }
        .f-col a:hover { color: var(--accent-gold-light); transform: translateX(4px); display: inline-block; }
        .f-col p { font-size: 0.9rem; color: rgba(255, 255, 255, 0.55); }

        .footer-bottom {
            padding-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-bottom p { font-size: 0.85rem; color: rgba(255, 255, 255, 0.4); }
        .footer-bottom-links { display: flex; gap: 20px; }
        .footer-bottom-links a { color: rgba(255, 255, 255, 0.4); text-decoration: none; font-size: 0.85rem; transition: var(--transition); }
        .footer-bottom-links a:hover { color: var(--accent-gold-light); }
        footer .btn-header { color: black; }
        footer .btn-header:hover { color: #000; }

        

        @media(max-width:1024px){.process-grid-6{grid-template-columns:repeat(2,1fr)}.intent-grid{grid-template-columns:repeat(2,1fr)}.qc-grid{grid-template-columns:repeat(2,1fr)}.services-grid-3{grid-template-columns:1fr 1fr}.permit-grid{grid-template-columns:1fr}}
        @media(max-width:980px){.hero-grid{grid-template-columns:1fr;gap:50px}.hero-content{text-align:center}.hero p{margin-left:auto;margin-right:auto}.hero-labels{justify-content:center}.hero-stats{justify-content:center;margin-left:auto;margin-right:auto;flex-wrap:wrap;gap:8px 0}.hero-visual{max-width:480px;margin:0 auto}.two-col,.two-col-wide{grid-template-columns:1fr}}
        @media(max-width:768px){.nav-links{display:none
  .f-grid { grid-template-columns: 1fr; gap: 30px; }
  .footer-bottom { flex-direction: column; text-align: center; }
}
